services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: vidio
      POSTGRES_PASSWORD: vidio_local
      POSTGRES_DB: vidio
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - vidio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidio -d vidio"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  vidio-postgres:
